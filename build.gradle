plugins {
    id("java")
    id("com.xpdustry.toxopid") version "4.2.0"
}

import com.xpdustry.toxopid.spec.ModPlatform

version '1.0'

sourceCompatibility = JavaVersion.VERSION_17

sourceSets {
    main {
        java {
            srcDirs = ["src"]
            exclude "test/**"
        }
    }
    test {
        java {
            srcDirs = ["src/test/java"]
        }
    }
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
    maven { url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven { url 'https://www.jitpack.io' }
    maven { url "https://maven.xpdustry.com/releases" }
    maven { url "https://maven.xpdustry.com/snapshots" }
}

ext {
    //the build number that this plugin is made for
    mindustryVersion = 'v159.7'
    jabelVersion = "93fde537c7"
}

toxopid {
    compileVersion = mindustryVersion
    runtimeVersion = mindustryVersion
    platforms = [ModPlatform.SERVER]
}

//java backwards compatibility flag
allprojects {
    tasks.withType(JavaCompile).configureEach {
        if (!name.contains("Test")) {
            options.compilerArgs.addAll(['--release', '17'])
        }
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:20.1.0'
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.1.2'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'net.dv8tion:JDA:5.0.0-alpha.17'

    testImplementation(toxopid.dependencies.mindustryCore)
    testImplementation(toxopid.dependencies.arcCore)
    testImplementation(toxopid.dependencies.mindustryHeadless)
    testImplementation(toxopid.dependencies.arcHeadless)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

task downloadMindustryAssets {
    description = 'Downloads Mindustry game assets (maps, icons) needed by PlayTest'
    group = 'help'

    def assetsDir = file("src/test/resources")
    def baseUrl = "https://raw.githubusercontent.com/Anuken/Mindustry/v159.7/core/assets"

    // Maps that Maps.load() hardcodes by name
    def defaultMaps = [
        "maze", "fortress", "labyrinth", "islands", "tendrils",
        "caldera", "wasteland", "shattered", "fork", "triad",
        "mudFlats", "moltenLake", "archipelago", "debrisField",
        "domain", "veins", "glacier", "passage", "canyon"
    ]

    doLast {
        // --- icons.properties ---
        download("$baseUrl/icons/icons.properties", file("$assetsDir/icons/icons.properties"))

        // --- 18 default maps ---
        defaultMaps.each { name ->
            download("$baseUrl/maps/default/${name}.msav", file("$assetsDir/maps/default/${name}.msav"))
        }

        // --- serpulo maps (list from GitHub API) ---
        def serpuloNames = listMapNames("serpulo")
        serpuloNames.each { name ->
            download("$baseUrl/maps/serpulo/${name}.msav", file("$assetsDir/maps/serpulo/${name}.msav"))
        }

        // --- serpulo hidden maps ---
        def hiddenNames = listMapNames("serpulo/hidden")
        hiddenNames.each { name ->
            download("$baseUrl/maps/serpulo/hidden/${name}.msav", file("$assetsDir/maps/serpulo/hidden/${name}.msav"))
        }

        // --- erekir maps ---
        def erekirNames = listMapNames("erekir")
        erekirNames.each { name ->
            download("$baseUrl/maps/erekir/${name}.msav", file("$assetsDir/maps/erekir/${name}.msav"))
        }

        println "All Mindustry test assets downloaded to $assetsDir"
    }
}

task cleanDownloadedAssets(type: Delete) {
    description = 'Deletes downloaded Mindustry test assets'
    group = 'help'
    delete file("src/test/resources/maps"), file("src/test/resources/icons")
}

def download(String url, File target) {
    if (target.exists()) return
    target.parentFile.mkdirs()
    println "  Downloading $url"
    new URL(url).withInputStream { input ->
        target.withOutputStream { it << input }
    }
}

def List<String> listMapNames(String planet) {
    def apiUrl = "https://api.github.com/repos/Anuken/Mindustry/contents/core/assets/maps/${planet}?ref=v159.7"
    def conn = new URL(apiUrl).openConnection()
    conn.setRequestProperty("Accept", "application/vnd.github.v3+json")
    def json = conn.inputStream.text
    def names = []
    def slurper = new groovy.json.JsonSlurper()
    slurper.parseText(json).each { entry ->
        if (entry.name.endsWith(".msav")) {
            names << entry.name.replace(".msav", "")
        }
    }
    return names
}

task runPlayTest(type: JavaExec) {
    dependsOn downloadMindustryAssets, compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'sectorized.PlayTest'
    workingDir = file("${buildDir}/playtest")
}

task stopPlayTest(type: Exec) {
    commandLine 'fuser', '-k', '6567/tcp'
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = "${project.archivesBaseName}.jar"
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(rootDir) {
        include "plugin.json"
    }

    destinationDirectory.set(file("$buildDir/../deploy/config/mods"))

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

task deploy {
    dependsOn jar
    doLast {
        def deployPath = System.getenv("MINDUSTRY_DEPLOY_PATH")
        if (!deployPath) {
            println "MINDUSTRY_DEPLOY_PATH environment variable is not set. Skipping deployment copy."
            return
        }
        
        def nasDir = file(deployPath)
        if (!nasDir.exists()) {
            println "Deployment target directory ${deployPath} does not exist. Attempting to mount via gio..."
            try {
                def process = "gio mount smb://nas-simon.local/docker".execute()
                process.waitFor()
                if (process.exitValue() == 0) {
                    println "Successfully mounted NAS!"
                } else {
                    println "Failed to mount NAS automatically: " + process.err.text
                }
            } catch (Exception e) {
                println "Failed to run gio mount: " + e.message
            }
        }
        
        def modsDir = file("${deployPath}/config/mods")
        if (modsDir.exists() || modsDir.mkdirs()) {
            try {
                def srcPath = jar.archiveFile.get().asFile.absolutePath
                def destPath = file("${modsDir.absolutePath}/${jar.archiveFileName.get()}").absolutePath
                def cpProcess = ["cp", srcPath, destPath].execute()
                cpProcess.waitFor()
                if (cpProcess.exitValue() == 0) {
                    println "Successfully deployed ${jar.archiveFileName.get()} to ${modsDir.absolutePath}!"
                } else {
                    throw new GradleException("Failed to copy jar via cp command: " + cpProcess.err.text)
                }
            } catch (Exception e) {
                throw new GradleException("Failed to deploy jar: " + e.message, e)
            }
        } else {
            throw new GradleException("Could not access or create mods folder at ${modsDir.absolutePath}")
        }
    }
}
